name: Content check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate site data
        run: ruby scripts/validate_content.rb
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
