<ul class="service-list">
  {% for item in site.data.service %}
    <li>
      <strong>{{ item.role }}:</strong>
      {% if item.link and item.link != '' %}<a href="{{ item.link }}" target="_blank" rel="noopener noreferrer">{{ item.organization }}</a>{% else %}{{ item.organization }}{% endif %}
      {% if item.period and item.period != '' %}<span>{{ item.period }}</span>{% endif %}
    </li>
  {% endfor %}
</ul>
